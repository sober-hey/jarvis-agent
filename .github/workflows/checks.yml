name: checks

# 只在能真跑的地方跑：Linux 上跑不需要 Apple 框架的部分。
# macOS 客户端（apps/mac、apps/ios、apps/watchos）与语音网关的真机链路不在 CI 覆盖内，
# 不要在这里伪造"已通过"。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 语音层要 websockets/numpy 等运行期依赖，装 runtime extra；
          # 只装核心包会让 voice/tests 在收集阶段就 ImportError。
          python -m pip install -e ".[runtime]" pytest "ruff==0.17.0" PyYAML jsonschema

      # 检查范围与 scripts/run_quality_checks.sh 一致：src、tests、scripts，外加已隔离的 voice/。
      # packaging/ 存量 lint 债未清（639 条），先不进 CI，免得红着跑；清理后一并加进来。
      - name: 静态检查
        run: ruff check src tests scripts voice

      - name: 格式检查
        run: ruff format --check src tests scripts voice

      # 数据根校验要求父目录属于当前用户且非共享（/tmp 会被拒），
      # 所以 TMPDIR 放在仓库外的 runner.temp（不能放 workspace：源码树会被拒）。
      - name: 内核层与契约测试
        env:
          TMPDIR: ${{ runner.temp }}/pytest
        run: |
          mkdir -p "$TMPDIR"
          python -m pytest tests -q

      - name: 语音子系统测试
        env:
          PYTHONPATH: voice:packaging
          TMPDIR: ${{ runner.temp }}/pytest
        run: |
          mkdir -p "$TMPDIR"
          python -m pytest voice/tests -q

      # packaging/ 全量需要 engine-venv 与供应商 SDK，CI 里跑会大量跳过或假失败，
      # 因此只在本地跑：见 docs/FRAMEWORK.md「测试怎么跑」。

  # macOS 客户端：Linux 上跑不了，单独一个 job。不联网、不需要凭据。
  macos-clients:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 一句话切分（UtteranceGate）：纯 Swift，不需要 Xcode 工程
      - name: 端点检测仿真（16 种说话方式）
        run: |
          cd apps/mac/JarvisMac
          swiftc -O Sources/JarvisIntegration/UtteranceGate.swift \
            Tests/UtteranceSimulation/main.swift -o "$RUNNER_TEMP/gate_sim"
          "$RUNNER_TEMP/gate_sim"

      # 唤醒词 / 响指 / 连拍阈值回归
      - name: 手势与唤醒阈值回归
        run: |
          cd apps/mac/Modules/Activation
          swift run -c release activation-regression

      # 纯 Swift 核心逻辑测试（不需要模拟器）
      - name: iOS 核心逻辑测试
        run: |
          cd apps/ios/JarvisVoice
          TMPDIR="$RUNNER_TEMP" python3 scripts/test_core.py

      - name: watchOS 核心逻辑测试
        run: |
          cd apps/watchos/JarvisWatch
          TMPDIR="$RUNNER_TEMP" python3 Scripts/test_core.py

      # 客户端能编译就说明工程文件、协议、资源引用是完整的
      - name: 编译 iOS 客户端
        run: |
          cd apps/ios/JarvisVoice
          xcodebuild -scheme JarvisVoice -destination 'generic/platform=iOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build

      - name: 编译 watchOS 客户端
        run: |
          cd apps/watchos/JarvisWatch
          xcodebuild -project JarvisWatch.xcodeproj -scheme JarvisWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -quiet CODE_SIGNING_ALLOWED=NO build
