[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-kernel"
version = "0.1.0.dev0"
description = "JARVIS independent deterministic execution kernel"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1"]

# 运行时真实依赖：packaging/ 下的语音网关、搜索、健康分析、声纹、路由校验。
# 之前只声明了 pydantic/typer，新机器装完跑不起来（例如 ddgs 缺失直接让搜索测试报
# ModuleNotFoundError）。macOS 专有部分（AppKit/objc，用于 jarvis_ui）放 macos extra。
[project.optional-dependencies]
runtime = [
  "websockets>=15,<17",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "sherpa-onnx>=1.13,<2",
  "ddgs>=9,<10",
]
macos = ["pyobjc-framework-Cocoa>=10,<12"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pyright>=1.1.400,<2", "jsonschema>=4.23,<5", "PyYAML>=6,<7", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 仓库里放着开源镜像与备份（public-repo/、_backups/），它们自带测试目录，
# pytest 从仓库根跑时必须跳过，否则会重复收集、互相污染。
norecursedirs = [
    "public-repo",   # 开源镜像（自带测试，别重复收集）
    "_backups",      # 备份 tarball
    "subprojects",   # 3D 子项目
    "components",    # 第三方上游（几万文件）
    "archive",       # 历史快照
    ".runs_01",      # 历史运行数据
    ".venv",
    "node_modules",
    "Evidence",      # 客户端构建/验收日志
    "Validation",    # 客户端验证快照（里面有旧的 test_*.py）
    "apps",          # 客户端工程（Swift 为主，里面的 python 是构建/验证脚本，不走 pytest）
]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
# 仓库里放着开源镜像、备份和第三方代码；ruff 从仓库根跑时要跳过，别把它们的代码算进来。
extend-exclude = ["public-repo", "_backups", ".runs_01", "subprojects", "components", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 语音子系统的 self_evaluate() 里是给人读的自述文字（能力、已知限制、改进方向）。
# 那些长句拆行后反而难读，且它们是输出内容而不是代码结构，所以这三个文件豁免行长限制。
# 其它规则照常生效；新增语音模块不要跟着豁免，先按 100 列写。
[tool.ruff.lint.per-file-ignores]
"voice/voice.py" = ["E501"]
"voice/voice_live.py" = ["E501"]
"voice/voice_port.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts/check_environment.py", "scripts/evidence_status.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
