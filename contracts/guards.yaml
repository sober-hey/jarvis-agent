schema_version: 1
status: DRAFT
approval_status: NOT_APPROVED
runtime_enabled: false
verification_status: NOT_IMPLEMENTED
contract_pack_status: NOT_FROZEN
purpose: K0-003 formal requirements catalogue; mirrors existing candidate predicates without registering
  a state machine or approving DP/ADR/A1–A6.
predicate_registry: transition_guards.yaml
expression_language_ref: transition_guards.yaml#expression_language
predicate_authority: transition_guards.yaml is the single candidate expression source; this documentation
  mirror must match byte-independent parsed structure.
source_status_semantics:
  SOURCE_IDENTIFIED: Requirement/candidate source found; NOT semantic approval or complete product evidence.
  SOURCE_MISSING: At least one formal source, decision or required evidence carrier is missing; candidate
    predicate retained, never filled with invented authorization.
failure_policy: DENY_KEEP_SOURCE_AND_ROLLBACK_ALL_WRITES
evaluation_requirements:
- fact reads an exact declared flat key; no coercion; booleans are not integers; only literal true permits.
  Missing, mistyped, unknown, cyclic or unevaluable input is UNKNOWN and denies. all/any use three-valued
  logic; no eval().
- same transaction for state/CAS/global epoch and cross-object invariants; prior durable evidence where
  stated; post-commit success requires actual atomic commit
- facts are produced by trusted transaction/verification adapters, never model-supplied or self-attested
  grants; no such adapters are implemented here
- Every edge requires ALL its named guards; FALSE or UNKNOWN denies, preserves source state and rolls
  back all related writes/events.
- Missing sources and unresolved dependencies remain blockers; synthetic facts can test expression wiring
  but cannot close approval/evidence gaps.
- A rejected edge does not select a fallback edge. Reconciliation/BLOCKED, if present, is evaluated separately
  with its own guards.
dp1_scope_note: DP-1 identifies 11 Step EDGES with no MP source, not 11 unique Guards. The existing registry
  contains additional shared/composite/helper guards; all are documented below.
known_traceability_limits:
- This catalogue does not silently repair candidate registry predicates or assert that their expressions
  fully implement every DP-1 row.
- 'S06/S11/S32 currently use block_safe only: they stop starts and record a cause, but do not separately
  require DP-1 conflict/precondition/retry-exhaustion evidence or decision=BLOCK. Candidate edge-specific
  semantic closure remains SOURCE_MISSING.'
- S23 uses block_safe plus block_pair but block_pair does not itself entail observation_bound. Binding
  evidence is a DP-1 requirement, not proven by structure-only tests; the trusted evidence adapter is
  absent.
- Unresolved edge dependencies remain as published. All catalogue expressions, denials and synthetic checks
  are design artifacts only.
