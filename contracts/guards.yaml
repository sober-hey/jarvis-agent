  - source_state_matches
  - version_matches
  - target_state_matches
  - one_row_cas
  - event_same_transaction
  - relationships_consistent
  - terminal_history_preserved
  - fenced_commit
  - block_safe
  formal_requirements_ref: docs/reports/K0-002_CORE_DECISION_PACKAGE.md §4.2 S32; §4.3 G1
  dp1_formal_definition_requirements: Retry proved unsafe or repeatedly failed, decision=BLOCK, recorded
    reason and shared FC/S1/S2/S3.
  unresolved_formalization: Existing block_safe omits retry-specific negative evidence or decision=BLOCK;
    OPEN-02/R-3/per-edge source remain missing.
  candidate_requirements:
  - Target row still has the exact source state of this edge
  - Target row version equals supplied optimistic version, checked in the write transaction
  - Mutation targets this edge, not a different destination
  - Conditional update includes id/source/version, increments version exactly once, affects exactly one
    row; otherwise roll back
  - Matching task/step/from/to/version event, related writes, and state update commit or roll back in
    the same database transaction; timestamp is not ordering authority
  - Post-write graph satisfies domain_relationships.yaml in this same transaction; no nontransactional
    check-then-write
  - No terminal Task/Step is reopened and no prior Plan/Step/Intent/Attempt or effect history is deleted
    or replaced
  - Classify actual writes, then authorized request-only OR fenced worker commit. Unknown/mixed/unclassified
    never bypass fencing.
  - Record cause and stop new starts while preserving evidence, not treating BLOCK as a known outcome
  disposition: CANDIDATE_ONLY_PENDING_SOURCE_AND_DEPENDENCIES
  missing_source: MP §8.1–8.3 has no per-edge authority; DP-1 and STEP_TRANSITION_SOURCE_PROPOSAL §2 are
    candidate design only.
  unresolved_dependencies:
  - DP-1
  - DP-5b
  - OPEN-06
  - D-G1a
