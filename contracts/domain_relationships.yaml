  target_where:
    state: VERIFIED
- id: committed_intent_has_specialized_record
  kind: foreign_key
  collection: intents
  fields: [operation_id]
  target: file_write_intents
  target_fields: [operation_id]
- id: publishable_step_has_attempt
  kind: exists
  collection: steps
  fields: [id]
  where_in:
    state: [EXECUTING, VERIFYING, NEEDS_RECONCILIATION, RETRY_WAIT, COMPLETED]
  target: attempts
  target_fields: [step_id]
- id: one_active_step_globally
  kind: unique
  collection: steps
  fields: []
  where_in:
    state: [CLAIMED, PREPARING, EXECUTING, VERIFYING]
intent_reuse:
  rule: Every Attempt for one Step references the same existing Intent row by operation_id; never duplicate
    an Intent row or operation_key per retry.
  enforced_by:
  - one_intent_per_step
  - operation_key_global_unique
  - attempt_intent_same_step
  immutable_across_attempts:
  - operation_id
  - operation_key
  - arguments_digest
  - input_snapshot_sha256
  - prepared_relpath
  - target_relpath
  - expected_sha256
  - expected_size
  temporal_limit: Snapshot relations cannot prove immutability across time; original-byte comparison and
    transactional Guard are still required.
existence_boundary: PENDING/CLAIMED/PREPARING may have no Intent or Attempt; before EXECUTING require
  prior committed Intent+FileWriteIntent, durable Prepared and associated Attempt. DDL upper bounds alone
  do not establish existence.
