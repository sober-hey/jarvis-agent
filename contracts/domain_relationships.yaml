schema_version: 1
status: DRAFT
approval_status: NOT_APPROVED
runtime_enabled: false
scope: Closed in-memory graph fixture; no SQL, no executor, no lifecycle approval. Complete record structure
  is checked before indexing; duplicate ids fail before FK checks.
key_identity: Per-collection ID namespace, exact strings; no normalization. Cross-collection same spelling
  does not alias records.
semantics:
  unique: Tuple equality among matching rows; exact cardinality 0..1.
  foreign_key: Every matching source tuple has exactly one matching target tuple; optional skip only for
    explicit null field. where/where_in filter source; target_where filters target.
  exists: Every selected source tuple has at least one target tuple, not necessarily unique.
  ordered_fields: upper >= lower; explicit null may be skipped.
  field_value: Exact typed equality, not truthy coercion.
  non_null: Selected field is present and non-null.
  errors: Any malformed/unknown rule or missing field fails closed; structural validation precedes relations.
