- id: published_step_has_stable_effect_id
  kind: non_null
  collection: steps
  where_in:
    state:
    - EXECUTING
    - VERIFYING
    - NEEDS_RECONCILIATION
    - RETRY_WAIT
    - COMPLETED
  field: logical_effect_id
- id: completed_step_intent_verified
  kind: foreign_key
  collection: steps
  fields:
