transaction_design:
  status: DRAFT_PENDING_DP
  runtime_enabled: false
  shared: 状态变更+关系写入+匹配 event 必须同一连接同一显式写事务提交；任何 Guard FALSE/UNKNOWN/SQL 错误回滚全部。
  one_row_cas:
    tables:
    - tasks
    - task_steps
    sql_shape: UPDATE <target> SET state=:to_state, version=version+1 WHERE id=:id AND state=:from_state
      AND version=:expected_version;
    application_check: 合法目标边先由状态机拒绝式验证；检查 rowcount 恰为1，事件 from/to/version 与此次更新一致；rowcount=0/多行不成功。
  fenced_commit:
    unresolved_dependencies:
    - DP-5b
    - OPEN-06
    sql_barrier_shape: UPDATE system_control SET worker_epoch=worker_epoch WHERE singleton_id=1 AND worker_epoch=:my_epoch;
    application_check: 持有固定 flock fd，可信实际 write-set 分类；Worker/recovery/相关推进（含 INSERT）同事务 barrier 恰一行，否则全部回滚。请求-only
      分支须可信授权，混合写集不能旁路。
    historical_attempt: 比较提交者 my_epoch 与当前全局行；绝不只比旧 Attempt，不把旧 epoch 作为权限，不改写其历史 epoch；缺行拒绝。
  event_same_transaction:
    tables:
    - events
    - tasks
    - task_steps
    boundary: FK/CHECK/sequence 只支持形状与关联；没有自动 trigger，无法单靠 DDL 强制每次变更有事件；K0-005 事务适配器承担。
    pending: DP-4/OPEN-10 未批准的幂等键、恢复证据与事件 carrier，保持 SOURCE_MISSING，不以 JSON 代替具名证据。
  relationships: FK/UNIQUE 是子集；active 指针 ACTIVE/反指、Intent+FileWriteIntent 共存、可发布 Step 有 Attempt、单全局活动
    Step 等需同事务关系验证。
  not_promised: 不实现取消-发布线性化/可信 Worker 身份/跨资源原子性；INV-010、A1-A6、ADR 均保持未批准/未实现。
guard_mapping_semantics:
  status: DRAFT_PENDING_DP
  authority: contracts/guards.yaml 是需求目录，不在这里重写谓词或补批准。
  sqlite_constraint_and_application: 所列约束只支持该 Guard 的结构子集，没有一个 Guard 由 DDL 完整实现。
  sqlite_transaction_and_application: 需要事务读取/条件写/rowcount/commit 等 SQLite 行为，同时必须可信应用适配器；不是 CHECK/普通 FK。
  application_only: 纯表达式/可信授权/OS/文件校验在应用层；普通 CHECK 不证明这些外部事实，持久审计不等于 Guard 本身。
  sqlite_carrier_pending_dp: 需要额外持久事实/结果/Observation/恢复/调度载体；所列为关联表而非已存在完整载体，缺失时拒绝，不降级为纯应用事实。
  composite: 递归使用具名依赖；其缺源与 DB 需求不因组合消失。
  source_missing: 逐条原样保留来源状态与未决项；SOURCE_MISSING/UNKNOWN 必须拒绝，不接受模型自报 true。
