schema_version: 1
status: DRAFT
approval_status: NOT_APPROVED
runtime_enabled: false
contract_pack_status: NOT_FROZEN
verification_status: OFFLINE_DESIGN_PROBES_ONLY
purpose: K0-004 SQLite Schema 与迁移设计草案；不是生产 DDL、迁移工具或 K0 完成证据。
dependencies:
  K0-002: IN_PROGRESS / NOT_FROZEN
  K0-003: IN_PROGRESS / DRAFT
source_refs:
- contracts/draft/plan.schema.json
- contracts/draft/step.schema.json
- contracts/draft/attempt.schema.json
- contracts/draft/execution_graph.schema.json
- contracts/task_transitions.yaml
- contracts/step_transitions.yaml
- contracts/guards.yaml
- contracts/domain_relationships.yaml
- contracts/database_constraints.yaml
- docs/reviews/K0-002-database-fixture-review.md
- docs/reviews/K0-002-database-fixture-acceptance.md
- docs/reports/K0-002_CORE_DECISION_PACKAGE.md
naming:
  status: DRAFT_PENDING_DP
  is_deployed_rename: false
  aliases:
    step_attempts: attempts
    task_events: events
    operation_intents.id: operation_intents.operation_id
  basis: 按本任务给定表名及 execution_graph.intent.operation_id 命名。MP/顶层草案仍用旧名；DP-6 未批准，禁止静默改名或假定兼容。
  not_a_deployed_migration: 没有 ALTER/复制/删除现有产品表；当前 packaging/ 数据库不在本草案适用范围。
representation:
  status: DRAFT_PENDING_DP
  primary_keys: TEXT PRIMARY KEY 显式 NOT NULL；避免普通 rowid 表允许 NULL 主键的 SQLite 特例。
  integers: INTEGER affinity 加 typeof CHECK；域 boolean 必须由显式适配映射为 0/1，禁止 truthiness。
  timestamps: 非负 UTC epoch 毫秒；时间戳不是事件排序或提交线性化权威。
  digest: TEXT 小写十六进制 64 字符；仅格式，不裁定 D-03/D-04 摘要字段或重算算法。
  document_version: JSON schema_version 是封套版本，不自动增加领域行列；schema_version 表仅跟踪候选物理迁移版本。
  state_checks: Task/Step 精确投影当前草案枚举；CHECK 只校验值，不能决定合法边、Guard 或授权。
  open_lifecycles: Plan/Attempt 仅已知 ACTIVE 部分索引谓词，不发明其他枚举、终态或 version 列。
  delete_policy: FK NO ACTION 无级联删除；不能单靠 FK 防止叶子行删除、历史重写或 INSERT OR REPLACE。
  extra_table: file_write_intents 保留通用 Intent 与专用载体分离；不把所有字段硬塞进 operation_intents。
  out_of_scope: artifacts 仅有字段清单、未有定稿类型；不猜造 artifacts DDL，结果/Observation/恢复证据载体仍待 DP-4。
connection_requirements:
  status: DRAFT_PENDING_DP
  foreign_keys:
    sql: PRAGMA foreign_keys = ON;
    readback: 1
    scope: 每条连接、BEGIN 前设置并读回；缺失/关闭拒绝写入。
  journal_mode:
    sql: PRAGMA journal_mode = WAL;
    readback: wal
    scope: 真实文件库打开时验证；本测试使用 :memory:，不声称 WAL 已验证。
  synchronous:
    sql: PRAGMA synchronous = FULL;
    readback: 2
  busy_timeout:
    sql: PRAGMA busy_timeout = 5000;
    readback: 5000
  json: events.payload_json 依赖 SQLite json_valid；正式迁移前探测能力，不吞掉函数缺失。
  failure: SQLITE_BUSY/超时/未知 COMMIT 结果不得视为成功或触发副作用重试；恢复/重试规则另行批准。
tables:
  tasks:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-1
    - DP-5b
    - D-03
    - OPEN-01
    - DP-6
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(id) > 0
      request_key:
        type: TEXT
        not_null: true
        unique: true
        check: length(request_key) > 0
      request_digest:
        type: TEXT
        not_null: true
        check: length(request_digest) = 64 AND request_digest NOT GLOB '*[^0-9a-f]*'
      task_kind:
        type: TEXT
        not_null: true
        check: length(task_kind) > 0
      state:
        type: TEXT
        not_null: true
        check: state IN ('CREATED', 'READY', 'RUNNING', 'VERIFYING', 'NEEDS_RECONCILIATION', 'RETRY_WAIT',
          'BLOCKED', 'SUCCEEDED', 'FAILED', 'CANCELED')
      active_plan_id:
        type: TEXT
        not_null: false
        check: length(active_plan_id) > 0
      cancel_requested_at_ms:
        type: INTEGER
        not_null: false
        check: cancel_requested_at_ms IS NULL OR (typeof(cancel_requested_at_ms) = 'integer' AND cancel_requested_at_ms
          >= 0)
      cancel_requested_by:
        type: TEXT
        not_null: false
        check: length(cancel_requested_by) > 0
      cancel_reason:
        type: TEXT
        not_null: false
        check: length(cancel_reason) > 0
      version:
        type: INTEGER
        not_null: true
        check: typeof(version) = 'integer' AND version >= 0
        default_sql: '0'
      created_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(created_at_ms) = 'integer' AND created_at_ms >= 0
      updated_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(updated_at_ms) = 'integer' AND updated_at_ms >= 0
    unique: []
    foreign_keys:
    - columns:
      - active_plan_id
      - id
      references:
        table: task_plans
        columns:
        - id
        - task_id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks:
    - updated_at_ms >= created_at_ms
    notes:
    - 最小 graph Task 投影另补 MP 已有 request/timestamp/cancel 列，未发明 TaskSpec JSON 载体。
    - 可空 active_plan_id 遵循 MATCH SIMPLE；同 Task FK 不证明目标 Plan ACTIVE 或指针双向一致。
    - version 与 state 用于同事务条件更新；不增加 Plan/Attempt CAS 列。
    state_values:
    - CREATED
    - READY
    - RUNNING
    - VERIFYING
    - NEEDS_RECONCILIATION
    - RETRY_WAIT
    - BLOCKED
    - SUCCEEDED
    - FAILED
    - CANCELED
  task_plans:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-2
    - D-01
    - D-04
    - D-07
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(id) > 0
      task_id:
        type: TEXT
        not_null: true
        check: length(task_id) > 0
      plan_version:
        type: INTEGER
        not_null: true
        check: typeof(plan_version) = 'integer' AND plan_version >= 1
      state:
        type: TEXT
        not_null: true
        check: length(state) > 0
      plan_digest:
        type: TEXT
        not_null: true
        check: length(plan_digest) = 64 AND plan_digest NOT GLOB '*[^0-9a-f]*'
      created_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(created_at_ms) = 'integer' AND created_at_ms >= 0
    unique:
    - - task_id
      - plan_version
    - - id
      - task_id
    foreign_keys:
    - columns:
      - task_id
      references:
        table: tasks
        columns:
        - id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks: []
    notes:
    - plan_version 是领域计划版本，不是行 CAS 或数据库迁移版本。
    - ACTIVE 唯一索引只能证明最多一个，不能证明存在、生命周期或 Task 指针指回。
    lifecycle_status: DRAFT_PENDING_DP
  task_steps:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-1
    - D-08
    - D-11
    - DP-5b
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(id) > 0
      task_id:
        type: TEXT
        not_null: true
        check: length(task_id) > 0
      plan_id:
        type: TEXT
        not_null: true
        check: length(plan_id) > 0
      ordinal:
        type: INTEGER
        not_null: true
        check: typeof(ordinal) = 'integer' AND ordinal >= 1
      logical_effect_id:
        type: TEXT
        not_null: false
        check: length(logical_effect_id) > 0
      state:
        type: TEXT
        not_null: true
        check: state IN ('PENDING', 'CLAIMED', 'PREPARING', 'EXECUTING', 'VERIFYING', 'NEEDS_RECONCILIATION',
          'RETRY_WAIT', 'BLOCKED', 'COMPLETED', 'FAILED', 'CANCELED')
      required:
        type: INTEGER
        not_null: true
        check: typeof(required) = 'integer' AND required IN (0, 1)
        default_sql: '1'
      version:
        type: INTEGER
        not_null: true
        check: typeof(version) = 'integer' AND version >= 0
        default_sql: '0'
    unique:
    - - plan_id
      - ordinal
    - - id
      - task_id
    foreign_keys:
    - columns:
      - plan_id
      - task_id
      references:
        table: task_plans
        columns:
        - id
        - task_id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks: []
    notes:
    - 没有重复添加 task FK，Task 归属经 Plan 的组合 FK 保证。
    - logical_effect_id 可空保持结构兼容；可发布状态必须非空属于事务 Guard。
    - 输入、前置条件、验证定义、退避/预算载体未批准，不猜造对应列。
    state_values:
    - PENDING
    - CLAIMED
    - PREPARING
    - EXECUTING
    - VERIFYING
    - NEEDS_RECONCILIATION
    - RETRY_WAIT
    - BLOCKED
    - COMPLETED
    - FAILED
    - CANCELED
  operation_intents:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-4
    - DP-5b
    - DP-6
    - D-16
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      operation_id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(operation_id) > 0
      step_id:
        type: TEXT
        not_null: true
        unique: true
        check: length(step_id) > 0
      operation_key:
        type: TEXT
        not_null: true
        unique: true
        check: length(operation_key) > 0
      operation_type:
        type: TEXT
        not_null: true
        check: operation_type = 'file.publish.no_clobber'
      tool_name:
        type: TEXT
        not_null: true
        check: tool_name = 'filesystem.publisher'
      tool_version:
        type: TEXT
        not_null: true
        check: length(tool_version) > 0
      arguments_digest:
        type: TEXT
        not_null: true
        check: length(arguments_digest) = 64 AND arguments_digest NOT GLOB '*[^0-9a-f]*'
      state:
        type: TEXT
        not_null: true
        check: state IN ('PREPARED', 'PUBLISHING', 'NEEDS_RECONCILIATION', 'VERIFIED', 'BLOCKED', 'FAILED')
      created_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(created_at_ms) = 'integer' AND created_at_ms >= 0
    unique:
    - - operation_id
      - step_id
    foreign_keys:
    - columns:
      - step_id
      references:
        table: task_steps
        columns:
        - id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks: []
    notes:
    - operation_id 是草案 JSON 域名，对应 MP id；命名兼容问题不在此自批。
    - 每 Step 至多一个 Intent、operation_key 全局唯一；不能证明原始参数字节跨时间不变。
    - 重试共享同一行；禁止用 INSERT OR REPLACE 或新 key 规避唯一约束。
    state_values:
    - PREPARED
    - PUBLISHING
    - NEEDS_RECONCILIATION
    - VERIFIED
    - BLOCKED
    - FAILED
  file_write_intents:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-4
    - DP-6
    - D-16
    - OPEN-01
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      operation_id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(operation_id) > 0
      input_snapshot_sha256:
        type: TEXT
        not_null: true
        check: length(input_snapshot_sha256) = 64 AND input_snapshot_sha256 NOT GLOB '*[^0-9a-f]*'
      prepared_relpath:
        type: TEXT
        not_null: true
        check: length(prepared_relpath) > 0
      target_relpath:
        type: TEXT
        not_null: true
        check: length(target_relpath) > 0
      expected_sha256:
        type: TEXT
        not_null: true
        check: length(expected_sha256) = 64 AND expected_sha256 NOT GLOB '*[^0-9a-f]*'
      expected_size:
        type: INTEGER
        not_null: true
        check: typeof(expected_size) = 'integer' AND expected_size >= 0
    unique: []
    foreign_keys:
    - columns:
      - operation_id
      references:
        table: operation_intents
        columns:
        - operation_id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks: []
    notes:
    - 仅数据格式/引用；路径归一化、NOFOLLOW、文件 fsync、内容哈希与发布仲裁不能由 TEXT CHECK 证明。
  attempts:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-3
    - DP-4
    - DP-5a
    - DP-5b
    - DP-6
    - D-02
    - D-07
    - D-13
    - D-15
    - OPEN-10
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      id:
        type: TEXT
        not_null: true
        primary_key: true
        check: length(id) > 0
      step_id:
        type: TEXT
        not_null: true
        check: length(step_id) > 0
      operation_id:
        type: TEXT
        not_null: true
        check: length(operation_id) > 0
      attempt_no:
        type: INTEGER
        not_null: true
        check: typeof(attempt_no) = 'integer' AND attempt_no >= 1
      worker_epoch:
        type: INTEGER
        not_null: true
        check: typeof(worker_epoch) = 'integer' AND worker_epoch >= 0
      state:
        type: TEXT
        not_null: true
        check: length(state) > 0
      started_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(started_at_ms) = 'integer' AND started_at_ms >= 0
      finished_at_ms:
        type: INTEGER
        not_null: false
        check: finished_at_ms IS NULL OR (typeof(finished_at_ms) = 'integer' AND finished_at_ms >= 0)
    unique:
    - - step_id
      - attempt_no
    foreign_keys:
    - columns:
      - step_id
      references:
        table: task_steps
        columns:
        - id
      on_delete: NO ACTION
      on_update: NO ACTION
    - columns:
      - operation_id
      - step_id
      references:
        table: operation_intents
        columns:
        - operation_id
        - step_id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks:
    - finished_at_ms IS NULL OR finished_at_ms >= started_at_ms
    - state != 'ACTIVE' OR finished_at_ms IS NULL
    notes:
    - worker_epoch 是历史提交者 epoch，不是 worker identity，不因全局 epoch 增长改写旧 Attempt。
    - 不添加结果/错误/owner/version 列；缺失证据或可信 owner 适配器时 Guard 拒绝。
    - 恢复后新 Attempt 的编号严格单调、旧行封口、旧 Intent 重用仍需事务与已批准生命周期。
    lifecycle_status: DRAFT_PENDING_DP
  system_control:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-5b
    - OPEN-06
    - OPEN-01
    - OPEN-08
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      singleton_id:
        type: INTEGER
        not_null: true
        check: singleton_id = 1
        primary_key: true
      emergency_stop:
        type: INTEGER
        not_null: true
        check: typeof(emergency_stop) = 'integer' AND emergency_stop IN (0, 1)
      backup_mode:
        type: INTEGER
        not_null: true
        check: typeof(backup_mode) = 'integer' AND backup_mode IN (0, 1)
      worker_epoch:
        type: INTEGER
        not_null: true
        check: typeof(worker_epoch) = 'integer' AND worker_epoch >= 0
      updated_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(updated_at_ms) = 'integer' AND updated_at_ms >= 0
    unique: []
    foreign_keys: []
    checks: []
    notes:
    - MP 只有字段清单、没有发布 DDL；这里类型、singleton_id=1、backup_mode 0/1 均为待批候选。
    - PK+CHECK 只保证至多一行；不自动种入全局 epoch，不允许缺行当作 epoch=0/未停止。
    - epoch 单调递增与比较在同一写事务；不能给 Attempt.worker_epoch 建 FK 到当前全局 epoch。
  events:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-1
    - DP-4
    - DP-5b
    - DP-6
    - OPEN-10
    source_refs:
    - MP-v1.1.1 §10.1; inherited unchanged by v1.1.2 §10.1
    columns:
      event_sequence:
        type: INTEGER
        not_null: true
        check: typeof(event_sequence) = 'integer' AND event_sequence >= 1
        primary_key: true
        autoincrement: true
      task_id:
        type: TEXT
        not_null: true
        check: length(task_id) > 0
      step_id:
        type: TEXT
        not_null: false
        check: length(step_id) > 0
      event_type:
        type: TEXT
        not_null: true
        check: length(event_type) > 0
      actor_type:
        type: TEXT
        not_null: true
        check: length(actor_type) > 0
      actor_id:
        type: TEXT
        not_null: true
        check: length(actor_id) > 0
      correlation_id:
        type: TEXT
        not_null: false
        check: length(correlation_id) > 0
      payload_json:
        type: TEXT
        not_null: true
        check: json_valid(payload_json)
      created_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(created_at_ms) = 'integer' AND created_at_ms >= 0
      from_state:
        type: TEXT
        not_null: false
        check: length(from_state) > 0
      to_state:
        type: TEXT
        not_null: false
        check: length(to_state) > 0
      from_version:
        type: INTEGER
        not_null: false
        check: from_version IS NULL OR (typeof(from_version) = 'integer' AND from_version >= 0)
      to_version:
        type: INTEGER
        not_null: false
        check: to_version IS NULL OR (typeof(to_version) = 'integer' AND to_version >= 0)
    unique: []
    foreign_keys:
    - columns:
      - task_id
      references:
        table: tasks
        columns:
        - id
      on_delete: NO ACTION
      on_update: NO ACTION
    - columns:
      - step_id
      - task_id
      references:
        table: task_steps
        columns:
        - id
        - task_id
      on_delete: NO ACTION
      on_update: NO ACTION
    checks:
    - (from_state IS NULL AND to_state IS NULL AND from_version IS NULL AND to_version IS NULL) OR (from_state
      IS NOT NULL AND to_state IS NOT NULL AND from_version IS NOT NULL AND to_version IS NOT NULL AND
      to_version = from_version + 1)
    notes:
    - event_sequence 继承 MP AUTOINCREMENT；仅已提交行的数据库顺序，不承诺连续无洞或 wall-clock 顺序。
    - 新增 from_state/to_state/from_version/to_version 是 DP-4 待批候选；普通审计事件可全空，状态事件必须全填且与目标行匹配。
    - payload_json 只检查有效 JSON；事件类型枚举、幂等键与唯一作用域未批准，故不添加伪定稿 UNIQUE。
    - 组合 FK 可空 step_id 允许 Task-only 事件，但不证明状态更新一定写了事件或反向因果。
  schema_version:
    status: DRAFT_PENDING_DP
    unresolved_dependencies:
    - DP-6
    - DP-7
    source_refs:
    - K0-004 current user requirement; migration design proposal, not published MP DDL
    columns:
      version:
        type: INTEGER
        not_null: true
        check: typeof(version) = 'integer' AND version >= 1
        primary_key: true
      previous_version:
        type: INTEGER
        not_null: false
        check: previous_version IS NULL OR (typeof(previous_version) = 'integer' AND previous_version
          >= 1)
      migration_name:
        type: TEXT
        not_null: true
        unique: true
        check: length(migration_name) > 0
      checksum_sha256:
        type: TEXT
        not_null: true
        check: length(checksum_sha256) = 64 AND checksum_sha256 NOT GLOB '*[^0-9a-f]*'
      applied_at_ms:
        type: INTEGER
        not_null: true
        check: typeof(applied_at_ms) = 'integer' AND applied_at_ms >= 0
    unique: []
    foreign_keys:
    - columns:
      - previous_version
      references:
        table: schema_version
        columns:
        - version
      on_delete: NO ACTION
      on_update: NO ACTION
    checks:
    - (version = 1 AND previous_version IS NULL) OR (version > 1 AND previous_version IS NOT NULL AND
      previous_version = version - 1)
    notes:
    - 新增迁移历史表，不是 Task/Plan 行版本或已安装版本；本文件的 schema_version:1 是 YAML 格式版本。
    - 自引用 FK + CHECK 约束前驱存在与相邻关系；应用迁移器仍须拒绝修改/删除历史、未知版本与 checksum 漂移。
indexes:
  ux_active_plan_per_task:
    status: DRAFT_PENDING_DP
    table: task_plans
    columns:
    - task_id
    unique: true
    where: state = 'ACTIVE'
    sql: |
      CREATE UNIQUE INDEX ux_active_plan_per_task
      ON task_plans(task_id)
      WHERE state = 'ACTIVE';
  ux_active_attempt_per_step:
