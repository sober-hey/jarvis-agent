migration_policy:
  status: DRAFT_PENDING_DP
  installed_version: NOT_APPLIED
  candidate_latest_version: 2
  version_authority: schema_version 历史表，MAX(version) 仅在全序列和 checksum 校验后有效；不同时维护不一致的 PRAGMA user_version。
  ordering: 候选版本正整数从1连续递增；previous_version 为前驱；迁移名及 SHA-256 绑定冻结后的真实 SQL 字节。
  gate: 'DP/ADR/命名兼容及适用冻结批准前禁止安装；当前测试仅向 :memory: 渲染，不提供生产迁移器。'
  application:
  - 关闭副作用接纳并持有可信迁移/单写互斥；真实文件库预检与一致性备份/恢复策略需独立验证。
  - 每连接 BEGIN 前设置并读回 foreign_keys；读回 journal_mode/synchronous/busy_timeout 及 JSON 能力。
  - 未知较新版本、缺少历史、重复/跳号/checksum 不匹配一律拒绝；不得 IF NOT EXISTS 掩盖异构旧库。
  - 每个版本 BEGIN IMMEDIATE，逐条 execute 执行 DDL 与迁移记录，单个 COMMIT；失败全部 ROLLBACK。不使用隐式提交的 executescript。
  - 循环 tasks/Plan 引用允许前向 CREATE；该版本全部 CREATE 完成前不得插入领域数据。保持 FK 开启，不靠关闭 FK 逃逸。
  - 索引迁移前扫描重复 ACTIVE/组合 FK；如有冲突拒绝，不删旧行、不选择任意幸存者。
  - 提交前 foreign_key_check / integrity_check；提交后以新只读连接验证版本、索引、约束、数据与统计。
  - 不得自动降级或 drop/recreate 用户库；恢复只能用已验证的一致性备份另行授权，保留失败/旧库证据。
  rollback_boundary: 每个版本内事务原子；版本2失败保留已提交版本1，不假装两版本整体回滚。进程崩溃/断电/WAL/Linux/ECS 仍需后续真实测试。
