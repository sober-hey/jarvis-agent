  - {id: RP-06, statement: "INADMISSIBLE 4 格运行时改写为 BLOCK", check: "表驱动负例", status: NOT_IMPLEMENTED}
  - {id: RP-07, statement: "UNRESOLVED 一律 BLOCK 且不产出 FAIL", check: "表驱动负例", status: NOT_IMPLEMENTED}
  - {id: RP-08, statement: "任一谓词不可判定 => 无 RETRY_SAFE", check: "谓词桩 + 负例", status: NOT_IMPLEMENTED}
  - {id: RP-09, statement: "落库 verdict 与表求值一致", check: "写入前后比对", status: NOT_IMPLEMENTED}
  - {id: RP-10, statement: "判定不读时钟/模型/环境", check: "依赖注入白名单", status: NOT_IMPLEMENTED}
  - {id: RP-11, statement: "落库 (observation, decision) 与 ADR-0006 结果的允许集不冲突（XR-01/XR-02）", check: "跨文档表驱动联合校验", status: NOT_IMPLEMENTED}

non_claims:
