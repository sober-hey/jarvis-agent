tensions:
  - id: PR-01
    description: "两行条件列的『任意』字面覆盖 FAIL；本文沿用既有登记 UNRESOLVED，不据此判允许或禁止。"
    affects: [R-12, R-16]
    resolution: NOT_DECIDED

retry_preconditions:
  rule: "全合取；任一 FALSE 或 UNDECIDABLE => 不得产生 RETRY_SAFE"
  failure_output: {decision: BLOCK, reason_code: RETRY_PRECONDITION_UNDECIDABLE}
  currently_reachable: false
  predicates:
    - {id: RP-P1, statement: "工具恢复策略已证明不产生不允许副作用", evidence: "tool_manifest recovery policy", decidable: false, blocked_by: OPEN-02}
    - {id: RP-P2, statement: "Prepared 达 DURABLE_PREPARED 且哈希复验通过", evidence: "prepared_relpath + expected_sha256 + measured sha256", decidable: partial, blocked_by: FS-031}
    - {id: RP-P3, statement: "复用同一 operation_id 与 operation_key", evidence: "operation_key unique", decidable: true, blocked_by: null}
    - {id: RP-P4, statement: "未取消、未停止、所有权与 epoch 有效", evidence: "cancel_requested_at_ms empty; stop inactive; worker_epoch match", decidable: partial, blocked_by: [OPEN-06, INV-008, INV-009, INV-010]}
    - {id: RP-P5, statement: "仅适用于 K0 no-clobber 发布", evidence: "operation_type == file.publish.no_clobber", decidable: true, blocked_by: null}
  cancel_overrides_retry: true

evidence_shape:
  location: evidence.pairing
  schema_change_required: false
  required_keys: [rule_id, verdict, table_version]
  consistency: "verdict must equal pair(observation, decision); inconsistent record must be rejected before persist"

# 与 ADR-0006 §6.5 的联合约束。两张表互不改判，只约束同一条记录不得自相矛盾。
cross_checks:
  - id: XR-01
    with: docs/adr/ADR-0006-cancel-publish-linearization.md §6.5
    statement: "已落库记录的 decision 必须落在 ADR-0006 对该结果允许的集合内；PROTOCOL_VIOLATION 不产生 reconciliation 记录"
    on_violation: {decision: BLOCK, reason_code: PAIRING_FORBIDDEN, persist: false}
    status: NOT_IMPLEMENTED
  - id: XR-02
    with: contracts/draft/cancel_publish_linearization.yaml outcome_table
    statement: "PUBLISH_WINS 只与 (EXPECTED_EFFECT_PRESENT, VERIFY) 同现；CANCEL_WINS_NO_EFFECT 只与 TARGET_ABSENT 同现；RETRY_SAFE 不在任何结果的允许集内"
    on_violation: {decision: BLOCK, reason_code: PAIRING_FORBIDDEN, persist: false}
    status: NOT_IMPLEMENTED
  - id: XR-03
    with: docs/adr/ADR-0006-cancel-publish-linearization.md U-8
    statement: "CANCEL_WINS_EFFECT_RETAINED 的 VERIFY/BLOCK 二选一未裁定，不得在实现中固化为其中之一"
    status: NOT_IMPLEMENTED

