# K0-002 Reconciliation 配对判定表（DRAFT 候选）
#
# 效力：DRAFT / NOT_APPROVED / NOT_VERIFIED / NOT_FROZEN，binding:false。
# 不改 contracts/reconciliation.schema.json，不新增枚举，不关闭 OPEN-02/03/12 或 FS-053/O-5。
# 与 docs/design/RECONCILIATION_PAIRING_RULES.md 同步；不一致时以该文档 §3 为准并回报缺陷。
schema_version: 1
status: DRAFT
approval: NOT_APPROVED
verification_status: NOT_VERIFIED
frozen: false
binding: false
authority:
  doc: docs/design/RECONCILIATION_PAIRING_RULES.md
  source_registry: docs/design/RECONCILIATION_PAIRING_PROPOSAL.md
  open_items: [OPEN-02, OPEN-03, OPEN-12, FS-053/O-5]
  schema: contracts/reconciliation.schema.json
table_version: draft-2026-10-18

verdicts:
  - ADMISSIBLE
  - INADMISSIBLE
  - UNRESOLVED

runtime_policy:
  candidate: true
  approval: NOT_APPROVED
  admissible_conditions_hold: emit_decision
  admissible_conditions_unmet: {decision: BLOCK, reason_code: PRECONDITION_UNMET}
  inadmissible: {decision: BLOCK, reason_code: PAIRING_FORBIDDEN}
  unresolved: {decision: BLOCK, reason_code: PAIRING_UNRESOLVED}
  unknown_input: {decision: null, reason_code: INPUT_INVALID, persist: false}
  default_allow: forbidden
  missing_cell: INPUT_INVALID
  evaluation_order: before_persist
  forbidden_dependencies: [wall_clock, model_output, environment, previous_record]

expected_counts: {ADMISSIBLE: 5, INADMISSIBLE: 4, UNRESOLVED: 7, total: 16}

